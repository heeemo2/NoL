<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول | NoL</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/auth.css" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الهيدر العلوي الثابت: شعار الموقع في المنتصف تماماً -->
  <header class="site-header">
    <a href="/" class="logo">NoL</a>
  </header>

  <!-- محتوى صفحة تسجيل الدخول في المنتصف -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header-text">
        <h1>تسجيل الدخول</h1>
        <p class="auth-subtitle">سجّل الدخول لإدارة صفحتك</p>
      </div>

      <form id="login-form">
        <div class="auth-field">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="auth-field">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="auth-submit">دخول</button>
        <p class="auth-error" id="error-msg"></p>
      </form>

      <div class="auth-switch">
        ليس لديك حساب؟ <a href="/signup.html">إنشاء حساب جديد</a>
      </div>
    </div>
  </main>

  <!-- الفوتر في أسفل الصفحة تماماً -->
  <footer class="footer">
    <a href="/" style="color:inherit;text-decoration:none">Powered by <span>NoL</span> © 2026</a>
  </footer>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
