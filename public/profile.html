<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NoL</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الهيدر العلوي: شعار NoL في المنتصف تماماً -->
  <header class="site-header">
    <a href="/" class="logo">NoL</a>
  </header>

  <!-- محتوى البطاقة في المنتصف -->
  <main class="page">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" src="" alt="avatar" />
      </div>
      <h1 id="name" class="name">NoL</h1>
      <p id="bio" class="bio"></p>

      <div id="links" class="links"></div>

      <div id="empty-state" class="empty-state" style="display:none"></div>
    </div>
  </main>

  <!-- الحقوق في أسفل الصفحة تماماً -->
  <footer class="footer">
    <a href="/" style="color:inherit;text-decoration:none">Powered by <span>NoL</span> © 2026</a>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
