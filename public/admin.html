<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة تحكم NoL</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/auth.css" />
<link rel="stylesheet" href="/css/admin.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  
  <!-- هيدر اسم الموقع NoL -->
  <header class="site-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05);">
    <div class="logo" style="font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 1px;">NoL</div>
    <button id="logout-btn-header" class="btn ghost small" style="display:none;">تسجيل الخروج</button>
  </header>

  <div class="admin-page">

    <!-- شاشة تحميل أولية (أثناء التحقق من حالة تسجيل الدخول) -->
    <div id="loading-screen" class="admin-card">
      <p>جارٍ التحقق...</p>
    </div>

    <!-- خطوة حجز اسم المستخدم (تظهر فقط إذا لم يحجزه المستخدم بعد) -->
    <div id="claim-screen" class="admin-card" style="display:none">
      <h2>اختر رابط صفحتك</h2>
      <p class="auth-subtitle">هذا هو الرابط الذي ستشاركه مع الآخرين</p>
      <div class="auth-field">
        <label>اسم المستخدم</label>
        <input type="text" id="claim-username" placeholder="username" autocomplete="off" />
      </div>
      <div class="username-preview" id="claim-preview"></div>
      <button id="claim-btn" class="auth-submit">حفظ ومتابعة</button>
      <p class="auth-error" id="claim-error"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="admin-card" style="display:none; width: 100%; max-width: 600px;">
      <div class="admin-header">
        <h2>لوحة التحكم</h2>
        <button id="logout-btn" class="btn ghost small">تسجيل الخروج</button>
      </div>

      <div class="my-link-box" id="my-link-box">
        <div class="my-link-box-title">رابط صفحتك الشخصية</div>
        <div class="my-link-box-row">
          <a id="my-link" href="#" target="_blank"></a>
          <button id="copy-link-btn" class="btn primary small"><i class="fa-solid fa-copy"></i> نسخ الرابط</button>
        </div>
      </div>

      <section class="section">
        <h3>الملف الشخصي</h3>
        
        <!-- معاينة البنر والصورة الدائرية (بنفس فكرة التصميم المطلوب) -->
        <div class="profile-banner-preview" id="banner-preview-container" style="position: relative; width: 100%; height: 160px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 12px; margin-bottom: 50px;">
          <div class="avatar-circle-wrapper" style="position: absolute; bottom: -35px; right: 30px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid #1e1b4b; overflow: hidden; background: #333;">
            <img id="avatar-preview-img" src="" alt="صورة البروفايل" style="width: 100%; height: 100%; object-fit: cover;" />
          </div>
        </div>

        <label>الاسم</label>
        <input type="text" id="profile-name" placeholder="اسمك" />
        <label>النبذة التعريفية</label>
        <textarea id="profile-bio" rows="2" placeholder="نبذة بسيطة عنك"></textarea>
        <label>رابط الصورة الشخصية (avatar URL)</label>
        <input type="text" id="profile-avatar" placeholder="https://..." />
        <button id="save-profile-btn" class="btn primary">حفظ البروفايل</button>
        <p id="profile-msg" class="msg-text"></p>
      </section>

      <section class="section">
        <h3>الروابط</h3>
        <div id="links-list" class="links-list"></div>

        <div class="add-link-form">
          <h4>إضافة رابط جديد</h4>
          <input type="text" id="new-link-label" placeholder="اسم الرابط (مثال: ديسكورد)" />
          <input type="text" id="new-link-url" placeholder="https://..." />
          <select id="new-link-icon">
            <option value="discord">Discord</option>
            <option value="snapchat">Snapchat</option>
            <option value="tiktok">TikTok</option>
            <option value="instagram">Instagram</option>
            <option value="x">X / Twitter</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="youtube">YouTube</option>
            <option value="telegram">Telegram</option>
            <option value="facebook">Facebook</option>
            <option value="spotify">Spotify</option>
            <option value="twitch">Twitch</option>
            <option value="github">GitHub</option>
            <option value="link">رابط عام</option>
          </select>
          <button id="add-link-btn" class="btn primary">إضافة الرابط</button>
        </div>
      </section>
    </div>
  </div>

  <!-- حقوق النشر في أسفل الصفحة -->
  <footer class="site-footer" style="text-align: center; padding: 20px; color: #888; font-size: 14px; margin-top: 40px;">
    <p>جميع الحقوق محفوظة © 2026 <span style="color: #a855f7; font-weight: bold;">NoL</span></p>
  </footer>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
