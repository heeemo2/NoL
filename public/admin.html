<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم NoL</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الهيدر العلوي: شعار NoL في المنتصف تماماً -->
  <header class="site-header">
    <div class="logo">NoL</div>
  </header>

  <main class="admin-main-container">

    <!-- شاشة التحميل -->
    <div id="loading-screen" class="admin-card">
      <p style="text-align: center;">جارٍ التحقق...</p>
    </div>

    <!-- شاشة حجز اسم المستخدم -->
    <div id="claim-screen" class="admin-card" style="display:none">
      <h2>اختر رابط صفحتك</h2>
      <p class="auth-subtitle">هذا هو الرابط الذي ستشاركه مع الآخرين</p>
      <div class="auth-field">
        <label>اسم المستخدم</label>
        <input type="text" id="claim-username" placeholder="username" autocomplete="off" />
      </div>
      <div class="username-preview" id="claim-preview"></div>
      <button id="claim-btn" class="auth-submit">حفظ ومتابعة</button>
      <p class="auth-error" id="claim-error"></p>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard" class="admin-card dashboard-card" style="display:none;">
      
      <div class="admin-header-row">
        <h2>لوحة التحكم</h2>
        <button id="logout-btn" class="btn ghost small">تسجيل الخروج</button>
      </div>

      <!-- قسم الملف الشخصي -->
      <section class="section">
        <h3>الملف الشخصي</h3>
        
        <input type="file" id="profile-image-input" accept="image/*" style="display: none;" />
        <input type="file" id="banner-image-input" accept="image/*" style="display: none;" />

        <!-- حاوية البنر والدائرة -->
        <div class="profile-banner-preview" id="banner-preview-container" title="اضغط لتغيير البنر">
          <div class="banner-edit-overlay"><i class="fa-solid fa-camera"></i> تغير البنر</div>
          
          <div class="avatar-circle-wrapper" id="avatar-container" title="اضغط لتغيير الصورة الشخصية">
            <div class="avatar-edit-overlay"><i class="fa-solid fa-camera"></i></div>
            <img id="avatar-preview-img" src="" alt="صورة البروفايل" />
          </div>
        </div>

        <label>الاسم</label>
        <input type="text" id="profile-name" placeholder="اسمك" />
        
        <label>النبذة التعريفية</label>
        <textarea id="profile-bio" rows="2" placeholder="نبذة بسيطة عنك"></textarea>
        
        <input type="hidden" id="profile-avatar" />

        <button id="save-profile-btn" class="btn primary">حفظ البروفايل</button>
        <p id="profile-msg" class="msg-text"></p>
      </section>

      <!-- قسم إدارة الروابط -->
      <section class="section">
        <h3>الروابط</h3>
        <div id="links-list" class="links-list"></div>

        <div class="add-link-form">
          <h4>إضافة رابط جديد</h4>
          <input type="text" id="new-link-label" placeholder="اسم الرابط (مثال: ديسكورد)" />
          <input type="text" id="new-link-url" placeholder="https://..." />
          <select id="new-link-icon">
            <option value="discord">Discord</option>
            <option value="snapchat">Snapchat</option>
            <option value="tiktok">TikTok</option>
            <option value="instagram">Instagram</option>
            <option value="x">X / Twitter</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="youtube">YouTube</option>
            <option value="telegram">Telegram</option>
            <option value="facebook">Facebook</option>
            <option value="spotify">Spotify</option>
            <option value="twitch">Twitch</option>
            <option value="github">GitHub</option>
            <option value="link">رابط عام</option>
          </select>
          <button id="add-link-btn" class="btn primary">إضافة الرابط</button>
        </div>
      </section>

      <!-- صندوق نسخ الرابط في أسفل لوحة التحكم -->
      <section class="section last-section">
        <div class="my-link-box" id="my-link-box">
          <div class="my-link-box-title">رابط صفحتك الشخصية (انسخه وشاركه مع أصدقائك)</div>
          <div class="my-link-box-row">
            <a id="my-link" href="#" target="_blank"></a>
            <button id="copy-link-btn" class="btn primary small"><i class="fa-solid fa-copy"></i> نسخ الرابط</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- حقوق النشر في أسفل الصفحة تماماً -->
  <footer class="site-footer">
    <p>جميع الحقوق محفوظة © 2026 <span>NoL</span></p>
  </footer>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
